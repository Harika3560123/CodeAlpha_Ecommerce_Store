services:
  - type: web
    name: codealpha-ecommerce-store
    env: python
    region: oregon
    plan: free
    buildCommand: "./build.sh"
    startCommand: "python manage.py migrate && python seed_data.py && gunicorn ecommerce_project.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: "*"
